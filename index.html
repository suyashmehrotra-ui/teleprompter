<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Teleprompter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Teleprompter</h1>
  </header>

  <main>
    <section class="controls">
      <div class="row">
        <label>Load text: <input id="fileInput" type="file" accept=".txt"></label>
        <button id="downloadBtn">Download</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div class="row">
        <textarea id="editor" placeholder="Paste your script here"></textarea>
      </div>

      <div class="row">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
        <button id="fullscreenBtn">Fullscreen</button>
        <label><input id="mirrorChk" type="checkbox"> Mirror</label>
      </div>

      <div class="row sliders">
        <label>Speed <span id="speedVal">80</span> px/s
          <input id="speed" type="range" min="10" max="400" value="80">
        </label>
        <label>Font <span id="fontVal">48</span> px
          <input id="fontSize" type="range" min="24" max="140" value="48">
        </label>
        <label>Line-height <span id="lhVal">1.35</span>
          <input id="lineHeight" type="range" min="1" max="2" step="0.05" value="1.35">
        </label>
      </div>

      <div class="row countdown">
        <label>Countdown (s): <input id="countdownInput" type="number" min="0" value="3"></label>
        <button id="startCountdownBtn">Start with countdown</button>
      </div>
    </section>

    <section class="telewrap">
      <div id="tele" class="tele">
        <div id="teleText" class="teleText" contenteditable="false"></div>
      </div>
    </section>
  </main>

  <div id="overlay" class="overlay hidden"></div>

  <script src="script.js"></script>
</body>
</html>
